
name: RESQNET Backend Tests

on:
  push:
    branches:
      - resqnet-v2-dev

  pull_request:
    branches:
      - main
      - resqnet-v2-dev

permissions:
  contents: read

jobs:
  backend-tests:
    name: Python Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: resqnet_ci_test_only
          POSTGRES_DB: resqnet_test_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resqnet_test_concurrency"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "sqlite://"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.2.0

      - name: Run automated tests
        run: python -m pytest tests -v

      - name: Initialize PostgreSQL test schema
        env:
          DATABASE_URL: "postgresql+psycopg://postgres:resqnet_ci_test_only@127.0.0.1:5432/resqnet_test_concurrency"
        run: |
          python -c "from database import engine; from sqlalchemy import text; u=engine.url; assert (u.drivername,u.host,u.port,u.database)==('postgresql+psycopg','127.0.0.1',5432,'resqnet_test_concurrency'), 'Unsafe connection URL'; c=engine.connect(); r=c.execute(text('SELECT current_database(), inet_server_port()')).one(); assert r==('resqnet_test_concurrency',5432), f'Unsafe database target: {r}'; print('Verified PostgreSQL test database:',r); c.close()"
          python -m alembic upgrade head

      - name: Run PostgreSQL reliability tests
        env:
          DATABASE_URL: "postgresql+psycopg://postgres:resqnet_ci_test_only@127.0.0.1:5432/resqnet_test_concurrency"
          RESQNET_PG_TEST_URL: "postgresql+psycopg://postgres:resqnet_ci_test_only@127.0.0.1:5432/resqnet_test_concurrency"
        run: python -m pytest tests_postgres -v
